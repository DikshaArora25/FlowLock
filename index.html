<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowLock - Dependency-Aware Project Workspace</title>
  <meta name="description" content="FlowLock is a real-time, dependency-aware project workspace that prevents teams from starting blocked work.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="landing.html" class="auth-brand" style="text-decoration: none;">
        <span class="auth-logo">🔒</span>
        <h1 class="auth-title">FlowLock</h1>
      </a>
      <p class="auth-tagline">"Dependencies decide what moves next."</p>

      <div class="demo-credentials-box" style="margin-bottom: 16px;">
        <p style="font-weight: 700; color: var(--text-main); margin-bottom: 4px;">Demo Workspace Access</p>
        <p>Email: <code>demo@flowlock.app</code></p>
        <p>Password: <code>flowlock123</code></p>
        <button id="quickDemoBtn" type="button" class="btn btn-secondary" style="width: 100%; margin-top: 10px; font-size: 12px; padding: 6px 12px;">
          ⚡ Continue with Demo Account
        </button>
      </div>

      <form id="loginForm" class="auth-form" style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" value="demo@flowlock.app" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" value="flowlock123" required>
        </div>

        <div id="loginError" class="form-error"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 4px;">
          Sign In to Workspace →
        </button>
      </form>

      <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center;">
        <p style="font-size: 13px; color: var(--text-muted);">
          Don't have an account? <a href="signup.html" style="color: #818cf8; font-weight: 700; text-decoration: none;">Create account</a>
        </p>
        <p style="margin-top: 10px;">
          <a href="landing.html" style="font-size: 12px; color: var(--text-dim); text-decoration: none;">
            ← Back to Product Overview
          </a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { checkAuthGuard, loginUser } from './js/auth.js';
    import { showToast } from './js/utils.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Check if already authenticated
      checkAuthGuard('index');

      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('loginError');
      const quickDemoBtn = document.getElementById('quickDemoBtn');

      async function handleLogin(email, password) {
        errorEl.textContent = '';
        errorEl.classList.remove('active');

        const result = await loginUser(email, password);
        if (result.success) {
          showToast('Authentication successful!', 'success');
          window.location.href = 'dashboard.html';
        } else {
          errorEl.textContent = result.message || 'Unable to sign in. Please try again.';
          errorEl.classList.add('active');
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        await handleLogin(email, password);
      });

      if (quickDemoBtn) {
        quickDemoBtn.addEventListener('click', () => {
          handleLogin('demo@flowlock.app', 'flowlock123');
        });
      }
    });
  </script>
</body>
</html>
