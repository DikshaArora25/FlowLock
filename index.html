<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowLock - Dependency-Aware Project Workspace</title>
  <meta name="description" content="FlowLock is a real-time, dependency-aware project workspace that prevents teams from starting blocked work.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-logo">🔒</span>
        <h1 class="auth-title">FlowLock</h1>
      </div>
      <p class="auth-tagline">"Dependencies decide what moves next."</p>

      <div class="demo-credentials-box">
        <p style="font-weight: 700; color: var(--text-main); margin-bottom: 4px;">Demo Workspace Access</p>
        <p>Email: <code>demo@flowlock.app</code></p>
        <p>Password: <code>flowlock123</code></p>
      </div>

      <form id="loginForm" class="auth-form" style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" value="demo@flowlock.app" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" value="flowlock123" required>
        </div>

        <div id="loginError" class="form-error"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Sign In to Workspace →
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { checkAuthGuard, loginUser } from './js/auth.js';
    import { showToast } from './js/utils.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Check if already authenticated
      checkAuthGuard('login');

      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('loginError');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        const result = loginUser(email, password);
        if (result.success) {
          showToast('Authentication successful!', 'success');
          window.location.href = 'dashboard.html';
        } else {
          errorEl.textContent = result.message;
          errorEl.classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
